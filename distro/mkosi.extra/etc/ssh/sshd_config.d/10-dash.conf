# DASH-AA Linux: in from another computer by key only — with no passwords, anything else would let anyone
# on the same network in (CLAUDE.md, No Passwords). The keys allowed are in ~dash/.ssh/authorized_keys,
# put there by the installer.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
