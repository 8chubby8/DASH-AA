# A system slot: the whole system, read-only. Its label carries the version (dash_1.2.1) and its
# partition UUID is fixed for this release, because the release's UKI finds its slot by it
# (root=PARTUUID=…). An update writes both into the spare slot.
[Partition]
Type=root
Label=dash_%A
UUID=@ROOTUUID@
Format=erofs
CopyFiles=/
ExcludeFiles=/boot/
ExcludeFiles=/efi/
ExcludeFiles=/dash-usb/
MakeDirectories=/boot /efi /data
Minimize=best
