# DASH-AA Linux — the system image (roadmap 1.2.1). Built by distro/build.sh with mkosi, as the ordinary
# user: no root, no password. One image is both the installer USB and the system it installs.
#
# The disk it makes (see repart/ and the installer, mkosi.extra/usr/lib/dash/dash-install):
#   ESP      systemd-boot and one unified kernel image (UKI) per system slot
#   slot A   the system, read-only (erofs) — labelled with its version, dash_<version>
#   slot B   the spare slot an update goes into (_empty until then)
#   data     everything that is the user's: /home, /var and changes to /etc. Never touched by an update.

[Distribution]
Distribution=arch
# Frozen: every package as the Arch Linux Archive had it on this day (decided 2026-10-15). A release is a
# DASH version plus this date, tested together.
Snapshot=2026/10/20

[Build]
# mkosi's own tools (erofs, ukify, systemd-repart…) in a sandbox, so the G14 needs nothing installed.
ToolsTree=default
WithNetwork=yes

[Output]
ImageId=dash
Format=disk
OutputDirectory=out
# The UKI and the system partition on their own as well: an update is those two (1.2.1, stage 2).
SplitArtifacts=uki,partitions

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# dash_1.2.1_<kernel>+3.efi, one per kernel: three tries to reach DASH before systemd-boot falls back to the other slot (Roger).
UnifiedKernelImageFormat=dash_%v_&k+3
KernelModulesInitrd=yes
KernelInitrdModules=default
                    erofs
                    ext4
                    overlay
                    vfat
                    nvme
                    usb-storage
                    uas
                    virtio_blk
                    virtio_scsi
KernelCommandLine=console=ttyS0,115200 console=tty0 ro rootfstype=erofs quiet loglevel=3 systemd.show_status=auto rd.systemd.show_status=auto
InitrdPackages=util-linux
               coreutils
               bash
               e2fsprogs

Hostname=dash
Locale=en_GB.UTF-8
Keymap=uk
Timezone=Europe/London
WithDocs=no
CleanPackageMetadata=yes

Packages=
        # The base system
        base
        linux                     # the kernel for most machines
        linux-surface             # the kernel for Microsoft Surfaces (their Wi-Fi, Bluetooth and touch) — the installer keeps one
        linux-firmware
        linux-firmware-marvell    # Wi-Fi on the Surface Pro 3 (and others): not in linux-firmware's own set
        intel-ucode
        amd-ucode
        systemd-ukify
        sudo                      # for you, at the bench — DASH itself never uses it
        nano
        less
        openssh                   # log in from another computer, by key only
        avahi                     # answers to dash.local on the network
        curl                      # Claude Code's own installer
        e2fsprogs
        dosfstools                # the installer
        # The screen
        labwc                     # the display program: DASH full screen, Display › Rotation
        xorg-xwayland             # DASH's window is an X11 one, shown through XWayland
        wlr-randr                 # Display › Screens
        wlopm                     # Display › Screen Blanking
        gammastep                 # Display › Colour, night light
        mesa
        vulkan-intel
        greetd                    # logs dash in at power-on and starts the screen — no login prompt
        ttf-dejavu
        adwaita-cursors           # a mouse pointer, for a mouse at the bench (labwc has none of its own)
        noto-fonts
        # What DASH's Java runtime needs from the system (the runtime itself is bundled in DASH)
        libxtst
        libxi
        libxrender
        libxext
        freetype2
        fontconfig
        alsa-lib
        # Sound
        pipewire
        pipewire-audio            # ALSA and Bluetooth for PipeWire, and the echo canceller for calls
        pipewire-pulse
        wireplumber
        pipewire-alsa
        alsa-utils
        # Connections
        networkmanager            # Connections › Wi-Fi and Ethernet
        wpa_supplicant
        dnsmasq                   # the DASH network (DASH hosting its own Wi-Fi)
        bluez                     # Connections › Bluetooth, and calls
        bluez-utils
        # Power
        polkit
        power-profiles-daemon     # Power › Performance
        upower                    # Power › Battery
        # Android Auto
        libusb                    # switching the phone into Android Auto
        ffmpeg                    # Android Auto's picture
        # Developer › Terminal
        util-linux                # setsid --ctty
