context.properties = { log.level = 1 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name   = aec/libspa-aec-webrtc
        node.latency   = 1024/48000
        capture.props  = { node.name = "dash-aa-ec-capture" }
        source.props   = { node.name = "dash-aa-ec-source" node.description = "DASH-AA call microphone" priority.session = 0 }
        sink.props     = { node.name = "dash-aa-ec-sink" node.description = "DASH-AA call speaker" priority.session = 0 }
        playback.props = { node.name = "dash-aa-ec-playback" }
      }
    }
]
